<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200" fill="none">
  <!-- SmartSurf phone-app tracker: your phone acts as the tracker. -->
  <defs>
    <linearGradient id="ph-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16304a"/>
      <stop offset="1" stop-color="#0d1e2f"/>
    </linearGradient>
  </defs>
  <rect x="28" y="10" width="64" height="180" rx="16" fill="url(#ph-body)" stroke="#2c4a63" stroke-width="3"/>
  <!-- speaker -->
  <rect x="50" y="20" width="20" height="4" rx="2" fill="#1e3d59"/>
  <!-- screen -->
  <rect x="36" y="34" width="48" height="126" rx="10" fill="#081521" stroke="#1e3d59" stroke-width="2"/>
  <!-- wave mark -->
  <path d="M42 76 c3 0 5 -6 8 -6 s5 6 8 6 5 -6 8 -6 5 6 8 6" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="60" cy="76" r="2.8" fill="#22d3ee"/>
  <!-- GPS pin -->
  <path d="M60 86 c-6 -6 -6 -14 0 -14 s6 8 0 14 z" fill="#22d3ee"/>
  <circle cx="60" cy="92" r="2.4" fill="#081521"/>
  <!-- SOS bar -->
  <rect x="44" y="112" width="32" height="16" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.6"/>
  <text x="60" y="124" text-anchor="middle" font-family="Barlow, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">SOS</text>
  <!-- home dot -->
  <circle cx="60" cy="178" r="4" fill="#22c55e"/>
</svg>